ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    [skip ci]
  autofix_prs: true
  autoupdate_commit_msg: |
    [pre-commit.ci] pre-commit autoupdate

    [skip ci]
  autoupdate_schedule: weekly
  submodules: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b # frozen: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=800"]
      - id: check-ast
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-shebang-scripts-are-executable
      - id: check-yaml
        args:
          - --allow-multiple-documents
      - id: detect-private-key
        exclude: |
          (?x)^(
          )$
      - id: detect-aws-credentials
        args:
          - --allow-missing-credentials
      - id: end-of-file-fixer
        exclude: |
          (?x)^(
          )$
      - id: name-tests-test
      - id: file-contents-sorter
      - id: requirements-txt-fixer
      - id: sort-simple-yaml
      - id: trailing-whitespace
      - id: fix-byte-order-marker
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-builtin-literals
      - id: check-byte-order-marker
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-xml
      - id: debug-statements
      - id: destroyed-symlinks
      - id: fix-byte-order-marker
      - id: fix-encoding-pragma
      - id: forbid-new-submodules
      - id: forbid-submodules
      - id: mixed-line-ending
      - id: pretty-format-json
        args:
          - --autofix
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: 7fe32563734d34c2242097e92caba89e4ec55b9a # frozen: v9.21.0
    hooks:
      - id: commitlint
        language: node
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional@21.2.4"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: efa716b1aab63601b256afc0cda469f0f7606759 # frozen: v0.9.7
    hooks:
      - id: ruff
        args:
          - --fix
          - --select=I
      - id: ruff-format
  - repo: https://github.com/tofuutils/pre-commit-opentofu
    rev: 5af24ae7a6d7f043fafc1a5b8387c33f0c521302 # frozen: v2.1.0
    hooks:
      - id: tofu_fmt
      - id: tofu_tflint
      - id: tofu_docs
