name: ci

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 12 */1 * *"

permissions:
  contents: read
  id-token: write
  packages: write
  pull-requests: write
  security-events: write

jobs:
  build-edge:
    if: |
      contains(fromJson('["push","pull_request"]'), github.event_name) &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Build docker
        uses: meysam81/build-docker@4702dd58cc9a0c0499fbdfe1e1bf8c23d4bc7c8c # main
        with:
          cosign: true
          dockerhub-password: ${{ secrets.DOCKERHUB_PASSWORD }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          image-extra-tags: |
            ghcr.io/${{ github.repository }}:${{ github.run_id }}
            ghcr.io/${{ github.repository }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:${{ github.run_id }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:latest
          image-name: ghcr.io/${{ github.repository }}
          kubescape: true
          kubescape-upload-sarif: true
          scout-cves: true

  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - id: release-please
        name: Release please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - if: steps.release-please.outputs.releases_created == 'true'
        name: Build docker
        uses: meysam81/build-docker@4702dd58cc9a0c0499fbdfe1e1bf8c23d4bc7c8c # main
        with:
          cosign: true
          dockerhub-password: ${{ secrets.DOCKERHUB_PASSWORD }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          image-extra-tags: |
            ghcr.io/${{ github.repository }}:${{ steps.release-please.outputs.tag_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:${{ steps.release-please.outputs.tag_name }}
          image-name: ghcr.io/${{ github.repository }}
          kubescape: true
          kubescape-upload-sarif: true
          ref: ${{ steps.release-please.outputs.tag_name }}
